name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android platform
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-36"

      - name: Install dependencies
        run: npm ci

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk runout.apk

      - uses: actions/upload-artifact@v4
        with:
          name: runout-apk
          path: runout.apk
          if-no-files-found: error

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Runout 1.0.${{ github.run_number }}
          files: runout.apk
          make_latest: true
          body: |
            Installable Runout app for Android.

            On your phone, download runout.apk from this release and open it. If Android asks, allow your browser to install unknown apps.

            This build is signed for sideloading. If a later install says the signature does not match, uninstall the old Runout first, then install the new APK.
